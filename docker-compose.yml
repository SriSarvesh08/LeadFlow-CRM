    environment:
      NODE_ENV: production
      PORT: "5005"
      FRONTEND_URL: ${FRONTEND_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MONGO_URI: "mongodb://${MONGO_ACTIVITY_USER:?Set MONGO_ACTIVITY_USER to an owner-provisioned account}:${MONGO_ACTIVITY_PASSWORD:?Set MONGO_ACTIVITY_PASSWORD for that account}@mongodb:27017/crm_activity?authSource=crm_activity"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-}
      NOTIFICATION_SERVICE_URL: http://notification-service:5007
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:5005:5005"
    healthcheck:
      test:
        - CMD
        - node
        - -e
