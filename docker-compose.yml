    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/support-service
        SERVICE_PORT: "5006"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    environment:
      NODE_ENV: production
      PORT: "5006"
      FRONTEND_URL: ${FRONTEND_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MONGO_URI: "mongodb://${MONGO_SUPPORT_USER:?Set MONGO_SUPPORT_USER to an owner-provisioned account}:${MONGO_SUPPORT_PASSWORD:?Set MONGO_SUPPORT_PASSWORD for that account}@mongodb:27017/crm_support?authSource=crm_support"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-}
      ACTIVITY_SERVICE_URL: http://activity-service:5005
      NOTIFICATION_SERVICE_URL: http://notification-service:5007
    depends_on:
