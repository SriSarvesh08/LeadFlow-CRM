        - -e
        - "require('http').get('http://127.0.0.1:5003/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

  sales-service:
    image: leadflow-sales:week1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/sales-service
        SERVICE_PORT: "5004"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    environment:
      NODE_ENV: production
      PORT: "5004"
      FRONTEND_URL: ${FRONTEND_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER_SALES:?Set DB_USER_SALES to an owner-provisioned MySQL account}
      DB_PASSWORD: ${DB_PASSWORD_SALES:?Set DB_PASSWORD_SALES for the owner-provisioned MySQL account}
      DB_NAME: crm_sales
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-}
      ACTIVITY_SERVICE_URL: http://activity-service:5005
      NOTIFICATION_SERVICE_URL: http://notification-service:5007
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:5004:5004"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5004/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

  activity-service:
    image: leadflow-activity:week1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/activity-service
        SERVICE_PORT: "5005"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
