        SERVICE_PORT: "5003"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    environment:
      NODE_ENV: production
      PORT: "5003"
      FRONTEND_URL: ${FRONTEND_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER_CUSTOMERS:?Set DB_USER_CUSTOMERS to an owner-provisioned MySQL account}
      DB_PASSWORD: ${DB_PASSWORD_CUSTOMERS:?Set DB_PASSWORD_CUSTOMERS for the owner-provisioned MySQL account}
      DB_NAME: crm_customers
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-}
      ACTIVITY_SERVICE_URL: http://activity-service:5005
      NOTIFICATION_SERVICE_URL: http://notification-service:5007
    depends_on:
      mysql:
        condition: service_healthy
    ports:
