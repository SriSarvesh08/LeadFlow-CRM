      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

  notification-service:
    image: leadflow-notification:week1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: services/notification-service
        SERVICE_PORT: "5007"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    environment:
      NODE_ENV: production
      PORT: "5007"
      FRONTEND_URL: ${FRONTEND_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MONGO_URI: "mongodb://${MONGO_NOTIFICATION_USER:?Set MONGO_NOTIFICATION_USER to an owner-provisioned account}:${MONGO_NOTIFICATION_PASSWORD:?Set MONGO_NOTIFICATION_PASSWORD for that account}@mongodb:27017/crm_notify?authSource=crm_notify"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@leadflow.in}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:5007:5007"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:5007/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - backend

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD for the MySQL container}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME for MongoDB initialization}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD for MongoDB initialization}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "if (db.adminCommand('ping').ok !== 1) quit(1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

volumes:
  mysql-data:
  mongodb-data:

networks:
  backend:
    driver: bridge
